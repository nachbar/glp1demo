<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<title>GLP-1 Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231f5f8b%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 font-family=%27sans-serif%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EG1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #5e6b78;
    --line: #dde3e9;
    --accent: #1f5f8b;
    --accent-text: #ffffff;
    --warn-bg: #fff3cd;
    --warn-text: #664d03;
    --warn-line: #ffe69c;
    --danger: #b42318;
    --danger-bg: #fdecea;
    --chip: #e8eef3;
    --series: #2a78d6;
    --grid: #e9edf1;
    --axis: #cfd6dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161c;
      --card: #1a222b;
      --text: #e8edf2;
      --muted: #9aa8b5;
      --line: #2c3845;
      --accent: #5aa6dc;
      --accent-text: #0b1620;
      --warn-bg: #3a2f0b;
      --warn-text: #ffe69c;
      --warn-line: #5c4a12;
      --danger: #ff7b6b;
      --danger-bg: #3a1a16;
      --chip: #263241;
      --series: #3987e5;
      --grid: #253039;
      --axis: #3a4855;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .banner {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-bottom: 1px solid var(--warn-line);
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  header.top h1 { font-size: 20px; margin: 0; flex: 1; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  button, .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
  button.link { border: none; background: none; color: var(--accent); padding: 6px 4px; min-height: 0; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); font-size: 14px; }
  .chip {
    display: inline-block;
    background: var(--chip);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .list a.item {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .list a.item:active { opacity: .7; }
  .item .name { font-weight: 700; font-size: 17px; }
  .item .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .delta-down { color: #157347; font-weight: 600; }
  .delta-up { color: var(--danger); font-weight: 600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .delta-down { color: #5cd38a; } }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    min-height: 44px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--chip); border-radius: 10px; padding: 10px; text-align: center; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .visit-actions { text-align: right; }
  .empty { text-align: center; color: var(--muted); padding: 32px 16px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .actions button { flex: 1; }
  .section-title { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 8px; }
  .section-title h2 { font-size: 17px; margin: 0; }
  dialog {
    border: none;
    border-radius: 14px;
    padding: 0;
    width: min(92vw, 480px);
    background: var(--card);
    color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .inner { padding: 18px; }
  dialog h3 { margin: 0 0 6px; }
  .footer-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
  .chart-card { padding: 14px 12px 8px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 0 4px; margin-bottom: 4px; }
  .chart-head h2 { font-size: 15px; margin: 0; }
  .chart-head .muted { font-size: 12px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; outline: none; }
  .chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .chart .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { stroke: var(--axis); stroke-width: 1; }
  .chart .area { fill: var(--series); fill-opacity: .1; }
  .chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--series); stroke: var(--card); stroke-width: 2; }
  .chart .dose-line { stroke: var(--muted); stroke-width: 1; stroke-opacity: .7; }
  .chart .dose-label { font-size: 11px; fill: var(--muted); font-weight: 600; }
  .chart .start-line { stroke: var(--axis); stroke-width: 1; }
  .chart .start-label { font-size: 10px; fill: var(--muted); }
  .chart .end-label { font-size: 12px; font-weight: 600; fill: var(--text); }
  .chart .cross { stroke: var(--text); stroke-width: 1; stroke-opacity: .5; display: none; }
  .chart .focus-dot { fill: var(--series); stroke: var(--card); stroke-width: 2; display: none; }
  .chart .tip {
    position: absolute; display: none; pointer-events: none; z-index: 2;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.35;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 200px;
  }
  .chart .tip .v { font-size: 15px; font-weight: 700; }
  .chart .tip .d { color: var(--muted); }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="banner" role="note">Demo only. Fake data. Nothing leaves your browser.</div>
<header class="top">
  <button id="backBtn" class="link" style="display:none" aria-label="Back to patient list">&larr; Patients</button>
  <h1 id="title">GLP-1 Patients</h1>
</header>
<main id="app"></main>

<dialog id="dlg"><div class="inner" id="dlgInner"></div></dialog>

<script>
(function () {
  'use strict';
  const KEY = 'glp1demo.v1';
  const DEMO_FLAG = 'glp1demo.seeded';

  // ---------- storage ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { patients: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  // ---------- demo data ----------
  function daysAgo(n) {
    const d = new Date(); d.setDate(d.getDate() - n);
    return d.toISOString().slice(0, 10);
  }
  function demoPatients() {
    return [
      { id: uid(), demo: true, name: 'Avery Thompson', medication: 'semaglutide', startWeight: 212, visits: [
        { id: uid(), date: daysAgo(84), dose: '0.25 mg weekly', weight: 212, sideEffects: 'Mild nausea first two days' },
        { id: uid(), date: daysAgo(56), dose: '0.5 mg weekly', weight: 205, sideEffects: 'None' },
        { id: uid(), date: daysAgo(28), dose: '1 mg weekly', weight: 198, sideEffects: 'Constipation, advised fiber and fluids' },
        { id: uid(), date: daysAgo(2), dose: '1 mg weekly', weight: 193, sideEffects: 'None' },
      ]},
      { id: uid(), demo: true, name: 'Jordan Reyes', medication: 'tirzepatide', startWeight: 248, visits: [
        { id: uid(), date: daysAgo(70), dose: '2.5 mg weekly', weight: 248, sideEffects: 'None' },
        { id: uid(), date: daysAgo(42), dose: '5 mg weekly', weight: 239, sideEffects: 'Fatigue, decreased appetite' },
        { id: uid(), date: daysAgo(14), dose: '7.5 mg weekly', weight: 231, sideEffects: 'Injection site redness' },
      ]},
      { id: uid(), demo: true, name: 'Morgan Patel', medication: 'semaglutide', startWeight: 186, visits: [
        { id: uid(), date: daysAgo(35), dose: '0.25 mg weekly', weight: 186, sideEffects: 'None' },
        { id: uid(), date: daysAgo(7), dose: '0.5 mg weekly', weight: 181, sideEffects: 'Heartburn after large meals' },
      ]},
      { id: uid(), demo: true, name: 'Casey Nguyen', medication: 'tirzepatide', startWeight: 230, visits: [
        { id: uid(), date: daysAgo(10), dose: '2.5 mg weekly', weight: 230, sideEffects: 'None yet' },
      ]},
      { id: uid(), demo: true, name: 'Riley Okafor', medication: 'semaglutide', startWeight: 201, visits: [] },
    ];
  }

  let state = load();
  if (!state.patients.length && !localStorage.getItem(DEMO_FLAG)) {
    state.patients = demoPatients();
    try { localStorage.setItem(DEMO_FLAG, '1'); } catch (e) {}
    save();
  }

  // ---------- helpers ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function medLabel(m) { return m === 'tirzepatide' ? 'Tirzepatide' : 'Semaglutide'; }
  function sortedVisits(p) { return [...(p.visits || [])].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); }
  function latestVisit(p) { return sortedVisits(p)[0] || null; }
  function currentWeight(p) { const v = latestVisit(p); return v && v.weight != null ? v.weight : p.startWeight; }
  function deltaHtml(p) {
    const d = Math.round((currentWeight(p) - p.startWeight) * 10) / 10;
    if (!d) return '<span class="muted">No change</span>';
    const cls = d < 0 ? 'delta-down' : 'delta-up';
    return `<span class="${cls}">${d > 0 ? '+' : ''}${d} lb</span>`;
  }
  function findPatient(id) { return state.patients.find(p => p.id === id); }

  // ---------- routing ----------
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/');
    if (parts[0] === 'patient' && parts[1]) return { view: 'detail', id: parts[1] };
    return { view: 'list' };
  }
  function go(hash) { location.hash = hash; }
  window.addEventListener('hashchange', render);

  // ---------- dialog ----------
  const dlg = $('#dlg'), dlgInner = $('#dlgInner');
  function openDialog(html, onMount) {
    dlgInner.innerHTML = html;
    if (onMount) onMount(dlgInner);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    const first = dlgInner.querySelector('input, select, textarea');
    if (first) setTimeout(() => first.focus(), 50);
  }
  function closeDialog() { dlg.close ? dlg.close() : dlg.removeAttribute('open'); dlgInner.innerHTML = ''; }
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); });
  function confirmDialog(title, body, okLabel, onOk) {
    openDialog(`
      <h3>${esc(title)}</h3>
      <p class="muted">${esc(body)}</p>
      <div class="actions">
        <button type="button" data-act="cancel">Cancel</button>
        <button type="button" class="danger" data-act="ok">${esc(okLabel)}</button>
      </div>`, root => {
      root.querySelector('[data-act=cancel]').onclick = closeDialog;
      root.querySelector('[data-act=ok]').onclick = () => { closeDialog(); onOk(); };
    });
  }

  // ---------- patient form ----------
  function patientForm(p) {
    const isEdit = !!p;
    openDialog(`
      <h3>${isEdit ? 'Edit patient' : 'New patient'}</h3>
      <form id="pf">
        <label for="pf-name">Name</label>
        <input id="pf-name" name="name" required autocomplete="off" value="${esc(p ? p.name : '')}">
        <label for="pf-med">Medication</label>
        <select id="pf-med" name="medication">
          <option value="semaglutide" ${!p || p.medication === 'semaglutide' ? 'selected' : ''}>Semaglutide</option>
          <option value="tirzepatide" ${p && p.medication === 'tirzepatide' ? 'selected' : ''}>Tirzepatide</option>
        </select>
        <label for="pf-wt">Starting weight (lb)</label>
        <input id="pf-wt" name="startWeight" type="number" inputmode="decimal" step="0.1" min="1" required value="${p && p.startWeight != null ? esc(p.startWeight) : ''}">
        <div class="actions">
          <button type="button" data-act="cancel">Cancel</button>
          <button type="submit" class="primary">${isEdit ? 'Save' : 'Add patient'}</button>
        </div>
      </form>`, root => {
      root.querySelector('[data-act=cancel]').onclick = closeDialog;
      root.querySelector('#pf').onsubmit = e => {
        e.preventDefault();
        const f = e.target;
        const name = f.name.value.trim();
        const startWeight = parseFloat(f.startWeight.value);
        if (!name || !(startWeight > 0)) return;
        if (isEdit) {
          p.name = name; p.medication = f.medication.value; p.startWeight = startWeight;
        } else {
          const np = { id: uid(), name, medication: f.medication.value, startWeight, visits: [] };
          state.patients.push(np);
          save(); closeDialog(); go('#/patient/' + np.id); return;
        }
        save(); closeDialog(); render();
      };
    });
  }

  // ---------- visit form ----------
  function visitForm(p, v) {
    const isEdit = !!v;
    const last = latestVisit(p);
    const today = new Date().toISOString().slice(0, 10);
    openDialog(`
      <h3>${isEdit ? 'Edit visit' : 'Log visit'}</h3>
      <p class="muted" style="margin:0 0 4px">${esc(p.name)}</p>
      <form id="vf">
        <div class="grid2">
          <div>
            <label for="vf-date">Date</label>
            <input id="vf-date" name="date" type="date" required value="${esc(v ? v.date : today)}">
          </div>
          <div>
            <label for="vf-wt">Weight (lb)</label>
            <input id="vf-wt" name="weight" type="number" inputmode="decimal" step="0.1" min="1" required value="${v && v.weight != null ? esc(v.weight) : ''}">
          </div>
        </div>
        <label for="vf-dose">Current dose</label>
        <input id="vf-dose" name="dose" required autocomplete="off" placeholder="e.g. 0.5 mg weekly" value="${esc(v ? v.dose : (last ? last.dose : ''))}">
        <label for="vf-se">Side effects</label>
        <textarea id="vf-se" name="sideEffects" placeholder="None">${esc(v ? v.sideEffects : '')}</textarea>
        <div class="actions">
          <button type="button" data-act="cancel">Cancel</button>
          <button type="submit" class="primary">${isEdit ? 'Save' : 'Save visit'}</button>
        </div>
      </form>`, root => {
      root.querySelector('[data-act=cancel]').onclick = closeDialog;
      root.querySelector('#vf').onsubmit = e => {
        e.preventDefault();
        const f = e.target;
        const weight = parseFloat(f.weight.value);
        if (!f.date.value || !(weight > 0) || !f.dose.value.trim()) return;
        const data = { date: f.date.value, weight, dose: f.dose.value.trim(), sideEffects: f.sideEffects.value.trim() };
        if (isEdit) Object.assign(v, data);
        else (p.visits = p.visits || []).push(Object.assign({ id: uid() }, data));
        save(); closeDialog(); render();
      };
    });
  }

  // ---------- views ----------
  const app = $('#app'), title = $('#title'), backBtn = $('#backBtn');
  backBtn.onclick = () => go('#/');

  function renderList() {
    title.textContent = 'GLP-1 Patients';
    backBtn.style.display = 'none';
    document.title = 'GLP-1 Tracker';
    const ps = [...state.patients].sort((a, b) => a.name.localeCompare(b.name));
    const demoCount = state.patients.filter(p => p.demo).length;
    let html = `
      <div class="row" style="margin-bottom:12px">
        <input id="search" type="search" placeholder="Search patients" class="grow" aria-label="Search patients" style="min-width:0">
        <button class="primary" id="addPatient">+ Patient</button>
      </div>`;
    html += '<div class="list" id="plist">';
    if (!ps.length) {
      html += `<div class="card empty">No patients yet. Tap <b>+ Patient</b> to add one${demoCount ? '' : ', or <button class="link" id="reseed">reload the demo patients</button>'}.</div>`;
    }
    for (const p of ps) {
      const lv = latestVisit(p);
      html += `
        <a class="item" href="#/patient/${esc(p.id)}" data-name="${esc(p.name.toLowerCase())}">
          <div class="row">
            <div class="name grow">${esc(p.name)}${p.demo ? ' <span class="muted" style="font-weight:400">(demo)</span>' : ''}</div>
            <span class="chip">${medLabel(p.medication)}</span>
          </div>
          <div class="meta muted">
            <span>${lv ? `${esc(lv.dose)} &middot; last visit ${fmtDate(lv.date)}` : 'No visits yet'}</span>
            <span>${currentWeight(p)} lb &nbsp;${deltaHtml(p)}</span>
          </div>
        </a>`;
    }
    html += '</div>';
    if (demoCount) {
      html += `<div class="card row">
        <div class="grow muted">${demoCount} made-up demo patient${demoCount === 1 ? '' : 's'} loaded.</div>
        <button class="danger" id="delDemo">Delete demo patients</button>
      </div>`;
    }
    html += '<p class="footer-note">All data is stored only in this browser (localStorage).</p>';
    app.innerHTML = html;

    $('#addPatient').onclick = () => patientForm(null);
    const search = $('#search');
    search.oninput = () => {
      const q = search.value.trim().toLowerCase();
      app.querySelectorAll('#plist a.item').forEach(a => { a.style.display = !q || a.dataset.name.includes(q) ? '' : 'none'; });
    };
    const del = $('#delDemo');
    if (del) del.onclick = () => confirmDialog('Delete demo patients?',
      `This removes the ${demoCount} made-up patient${demoCount === 1 ? '' : 's'} and their visits. Patients you added yourself are kept.`,
      'Delete demo patients', () => {
        state.patients = state.patients.filter(p => !p.demo);
        save(); render();
      });
    const reseed = $('#reseed');
    if (reseed) reseed.onclick = e => { e.preventDefault(); state.patients.push(...demoPatients()); save(); render(); };
  }

  function renderDetail(id) {
    const p = findPatient(id);
    if (!p) { go('#/'); return; }
    title.textContent = p.name;
    document.title = p.name + ' · GLP-1 Tracker';
    backBtn.style.display = '';
    const visits = sortedVisits(p);
    const cw = currentWeight(p);
    const lost = Math.round((p.startWeight - cw) * 10) / 10;
    const pct = p.startWeight ? Math.round((lost / p.startWeight) * 1000) / 10 : 0;

    let html = `
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <span class="chip">${medLabel(p.medication)}</span>
          ${p.demo ? '<span class="muted">Demo patient</span>' : ''}
          <span class="grow"></span>
          <button class="link" id="editPatient">Edit</button>
        </div>
        <div class="stats">
          <div class="stat"><div class="v">${esc(p.startWeight)}</div><div class="l">Start (lb)</div></div>
          <div class="stat"><div class="v">${esc(cw)}</div><div class="l">Current (lb)</div></div>
          <div class="stat"><div class="v ${lost > 0 ? 'delta-down' : lost < 0 ? 'delta-up' : ''}">${lost > 0 ? '-' : lost < 0 ? '+' : ''}${Math.abs(lost)}</div><div class="l">${pct ? (pct > 0 ? '-' : '+') + Math.abs(pct) + '%' : 'Change (lb)'}</div></div>
        </div>
      </div>
      ${visits.length ? `<div class="card chart-card">
        <div class="chart-head"><h2>Weight over time</h2><span class="muted">lb &middot; vertical markers = dose changes</span></div>
        <div class="chart" id="chart"></div>
      </div>` : ''}
      <div class="section-title">
        <h2>Visits (${visits.length})</h2>
        <button class="primary" id="addVisit">+ Log visit</button>
      </div>`;
    if (!visits.length) {
      html += '<div class="card empty">No visits logged yet.</div>';
    } else {
      html += '<div class="card" style="padding:4px 10px"><table><thead><tr><th>Date</th><th>Dose</th><th class="num">Weight</th><th></th></tr></thead><tbody>';
      for (const v of visits) {
        html += `<tr>
          <td>${fmtDate(v.date)}</td>
          <td>${esc(v.dose)}${v.sideEffects ? `<div class="muted" style="font-size:13px">${esc(v.sideEffects)}</div>` : ''}</td>
          <td class="num">${esc(v.weight)} lb</td>
          <td class="visit-actions"><button class="link" data-edit="${esc(v.id)}" aria-label="Edit visit">Edit</button></td>
        </tr>`;
      }
      html += '</tbody></table></div>';
    }
    html += `<div class="actions"><button class="danger" id="delPatient">Delete patient</button></div>`;
    app.innerHTML = html;
    chartPatient = visits.length ? p : null;
    if (chartPatient) renderChart(p, $('#chart'));

    $('#editPatient').onclick = () => patientForm(p);
    $('#addVisit').onclick = () => visitForm(p, null);
    app.querySelectorAll('[data-edit]').forEach(b => {
      b.onclick = () => {
        const v = p.visits.find(x => x.id === b.dataset.edit);
        if (!v) return;
        visitForm(p, v);
        // add a delete button inside the visit edit dialog
        const actions = dlgInner.querySelector('.actions');
        const delBtn = document.createElement('button');
        delBtn.type = 'button'; delBtn.className = 'danger'; delBtn.textContent = 'Delete';
        delBtn.onclick = () => { closeDialog(); confirmDialog('Delete this visit?', fmtDate(v.date) + ' · ' + v.dose, 'Delete visit', () => {
          p.visits = p.visits.filter(x => x.id !== v.id); save(); render();
        }); };
        actions.insertBefore(delBtn, actions.firstChild);
      };
    });
    $('#delPatient').onclick = () => confirmDialog('Delete ' + p.name + '?', 'This removes the patient and all of their visits from this browser.', 'Delete patient', () => {
      state.patients = state.patients.filter(x => x.id !== p.id); save(); go('#/');
    });
  }

  // ---------- weight chart ----------
  let chartPatient = null;
  let chartOutsideTap = null;
  let lastChartWidth = 0;
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const c = $('#chart');
      if (chartPatient && c && c.clientWidth !== lastChartWidth) renderChart(chartPatient, c);
    }, 150);
  });

  function parseDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).getTime(); }
  function niceStep(span, target) {
    const raw = span / Math.max(1, target);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 5, 10]) if (raw <= m * mag) return m * mag;
    return 10 * mag;
  }
  function svgEl(tag, attrs, text) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text != null) el.textContent = text;
    return el;
  }
  function fmtShort(ts, withYear) {
    return new Date(ts).toLocaleDateString(undefined, withYear ? { month: 'short', day: 'numeric', year: '2-digit' } : { month: 'short', day: 'numeric' });
  }

  function renderChart(p, container) {
    const pts = [...(p.visits || [])]
      .filter(v => v.date && v.weight != null)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
      .map(v => ({ v, t: parseDate(v.date), w: Number(v.weight) }));
    container.innerHTML = '';
    if (!pts.length) return;

    const W = Math.max(240, container.clientWidth || 320);
    lastChartWidth = container.clientWidth;
    const H = 230;
    const M = { top: 34, right: 56, bottom: 26, left: 38 };
    const pw = W - M.left - M.right, ph = H - M.top - M.bottom;

    // scales
    let t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    if (t1 - t0 < 86400000 * 2) { t0 -= 86400000; t1 += 86400000; }
    const ws = pts.map(d => d.w).concat([Number(p.startWeight)].filter(n => !isNaN(n)));
    let wmin = Math.min(...ws), wmax = Math.max(...ws);
    if (wmax - wmin < 4) { wmin -= 2; wmax += 2; }
    const step = niceStep(wmax - wmin, 3);
    const y0 = Math.floor(wmin / step) * step - (wmin % step === 0 ? step : 0);
    const y1 = Math.ceil(wmax / step) * step + (wmax % step === 0 ? step : 0);
    const X = t => M.left + ((t - t0) / (t1 - t0)) * pw;
    const Y = w => M.top + (1 - (w - y0) / (y1 - y0)) * ph;

    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', tabindex: '0',
      'aria-label': `Weight over time for ${p.name}, ${pts.length} visit${pts.length === 1 ? '' : 's'}; details in the visits table below` });

    // gridlines + y ticks
    for (let w = y0; w <= y1 + 1e-9; w += step) {
      const y = Y(w);
      svg.appendChild(svgEl('line', { class: w === y0 ? 'axis' : 'grid', x1: M.left, x2: M.left + pw, y1: y, y2: y }));
      svg.appendChild(svgEl('text', { class: 'tick', x: M.left - 6, y: y + 4, 'text-anchor': 'end' }, String(Math.round(w))));
    }
    // x ticks
    const withYear = new Date(t0).getFullYear() !== new Date(t1).getFullYear();
    const nx = Math.max(2, Math.min(6, Math.floor(pw / 72)));
    for (let i = 0; i < nx; i++) {
      const t = t0 + ((t1 - t0) * i) / (nx - 1);
      const anchor = i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle';
      svg.appendChild(svgEl('text', { class: 'tick', x: X(t), y: H - 8, 'text-anchor': anchor }, fmtShort(t, withYear)));
    }

    // starting-weight reference
    const sw = Number(p.startWeight);
    if (!isNaN(sw) && sw !== pts[0].w) {
      const y = Y(sw);
      svg.appendChild(svgEl('line', { class: 'start-line', x1: M.left, x2: M.left + pw, y1: y, y2: y }));
      svg.appendChild(svgEl('text', { class: 'start-label', x: M.left + 4, y: y - 4 }, 'Start ' + sw));
    }

    // dose-change markers (first visit + every visit whose dose differs from the previous one)
    const norm = s => String(s || '').trim().toLowerCase();
    const changes = [];
    pts.forEach((d, i) => { if (i === 0 || norm(d.v.dose) !== norm(pts[i - 1].v.dose)) changes.push(d); });
    let lastLabelEnd = [-Infinity, -Infinity]; // per row
    for (const d of changes) {
      const x = X(d.t);
      svg.appendChild(svgEl('line', { class: 'dose-line', x1: x, x2: x, y1: M.top - 4, y2: M.top + ph }));
      const label = String(d.v.dose || '').replace(/\s*(weekly|daily|per week|q\s*week)\s*$/i, '').trim() || '—';
      const est = label.length * 6.2 + 6;
      const flip = x + est > W - 4;
      const lx = flip ? x - 4 : x + 4;
      const start = flip ? x - est : x;
      const row = start > lastLabelEnd[0] + 4 ? 0 : start > lastLabelEnd[1] + 4 ? 1 : 0;
      lastLabelEnd[row] = flip ? x : x + est;
      const ly = M.top - 8 - (row ? 0 : 12);
      svg.appendChild(svgEl('text', { class: 'dose-label', x: lx, y: ly, 'text-anchor': flip ? 'end' : 'start' }, label));
    }

    // area + line + dots
    const coords = pts.map(d => [X(d.t), Y(d.w)]);
    if (coords.length > 1) {
      const path = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
      const base = M.top + ph;
      svg.appendChild(svgEl('path', { class: 'area', d: `${path} L${coords[coords.length - 1][0].toFixed(1)} ${base} L${coords[0][0].toFixed(1)} ${base} Z` }));
      svg.appendChild(svgEl('path', { class: 'line', d: path }));
    }
    coords.forEach(c => svg.appendChild(svgEl('circle', { class: 'dot', cx: c[0], cy: c[1], r: 4 })));

    // end label (last value)
    const last = coords[coords.length - 1];
    svg.appendChild(svgEl('text', { class: 'end-label', x: last[0] + 9, y: last[1] + 4 }, pts[pts.length - 1].w + ' lb'));

    // hover layer
    const cross = svgEl('line', { class: 'cross', y1: M.top, y2: M.top + ph });
    const focusDot = svgEl('circle', { class: 'focus-dot', r: 6 });
    const hit = svgEl('rect', { x: M.left - 12, y: 0, width: pw + 24, height: H, fill: 'transparent' });
    svg.appendChild(cross); svg.appendChild(focusDot); svg.appendChild(hit);
    container.appendChild(svg);

    const tip = document.createElement('div');
    tip.className = 'tip';
    const tipV = document.createElement('div'); tipV.className = 'v';
    const tipD = document.createElement('div'); tipD.className = 'd';
    const tipDose = document.createElement('div');
    const tipSE = document.createElement('div'); tipSE.className = 'd';
    tip.append(tipV, tipD, tipDose, tipSE);
    container.appendChild(tip);

    let sel = -1;
    function show(i) {
      sel = i;
      const d = pts[i], c = coords[i];
      cross.setAttribute('x1', c[0]); cross.setAttribute('x2', c[0]); cross.style.display = 'block';
      focusDot.setAttribute('cx', c[0]); focusDot.setAttribute('cy', c[1]); focusDot.style.display = 'block';
      tipV.textContent = d.w + ' lb';
      tipD.textContent = fmtDate(d.v.date);
      tipDose.textContent = d.v.dose || '';
      tipSE.textContent = d.v.sideEffects ? 'Side effects: ' + d.v.sideEffects : '';
      tip.style.display = 'block';
      const scale = container.clientWidth / W;
      const cw = container.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = c[0] * scale - tw / 2;
      left = Math.max(0, Math.min(cw - tw, left));
      let top = c[1] * scale - th - 14;
      if (top < 0) top = c[1] * scale + 14;
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    }
    function hide() { sel = -1; cross.style.display = focusDot.style.display = tip.style.display = 'none'; }
    function nearest(clientX) {
      const r = svg.getBoundingClientRect();
      const x = ((clientX - r.left) / r.width) * W;
      let best = 0, bd = Infinity;
      coords.forEach((c, i) => { const d = Math.abs(c[0] - x); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    hit.addEventListener('pointermove', e => show(nearest(e.clientX)));
    hit.addEventListener('pointerdown', e => show(nearest(e.clientX)));
    svg.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hide(); });
    if (chartOutsideTap) document.removeEventListener('pointerdown', chartOutsideTap);
    chartOutsideTap = e => { if (!container.contains(e.target)) hide(); };
    document.addEventListener('pointerdown', chartOutsideTap);
    svg.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const n = pts.length;
        show(sel < 0 ? (e.key === 'ArrowRight' ? 0 : n - 1) : (sel + (e.key === 'ArrowRight' ? 1 : n - 1)) % n);
      } else if (e.key === 'Escape') hide();
    });
    svg.addEventListener('blur', hide);
  }

  function render() {
    const r = route();
    if (r.view === 'detail') renderDetail(r.id); else renderList();
    window.scrollTo(0, 0);
  }
  render();
})();
</script>
</body>
</html>
